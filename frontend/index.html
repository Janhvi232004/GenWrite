<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <meta
      name="description"
      content="GenWrite AI - Generate exceptional content with AI in seconds."
    />
    <title>GenWrite AI - Generate exceptional content with AI in seconds</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint so there is no flash -->
    <script>
      try {
        var t = localStorage.getItem('genwrite-theme') || 'dark';
        var r = document.documentElement;
        r.classList.toggle('dark', t === 'dark');
        r.classList.toggle('light', t === 'light');
        r.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
